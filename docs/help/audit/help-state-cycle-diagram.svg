<svg viewBox="0 0 600 695" role="img" aria-label="Conceptual control flow for one active state. Transitions commit at the branch where selected; they do not wait until after child execution. Invalid ticks and latched faults return before normal execution." style="background:#222;color:#e2e8f0;font-family:Arial,sans-serif;" xmlns="http://www.w3.org/2000/svg" width="600" height="695"><title>Conceptual control flow for one active state. Transitions commit at the branch where selected; they do not wait until after child execution. Invalid ticks and latched faults return before normal execution.</title><defs><marker id="help-arrow-rj" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="rgb(255, 255, 255)"></path></marker><marker id="help-arrow-rj-open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="rgb(255, 255, 255)"></path></marker></defs><defs><marker id="help-arrow-rj-generalization" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M 0 0 L 12 6 L 0 12 z" fill="rgb(36, 36, 36)" stroke="rgb(255, 255, 255)"></path></marker></defs><g><rect x="110" y="33" width="140" height="48" rx="8" fill="rgb(43, 43, 43)" stroke="rgb(161, 161, 170)"></rect><text x="180" y="62" text-anchor="middle" fill="rgb(255, 255, 255)" font-size="12"><tspan x="180" dy="0">Validate tick</tspan></text></g><g><rect x="110" y="123" width="140" height="48" rx="8" fill="rgb(43, 43, 43)" stroke="rgb(161, 161, 170)"></rect><text x="180" y="152" text-anchor="middle" fill="rgb(255, 255, 255)" font-size="12"><tspan x="180" dy="0">Increment active timers</tspan></text></g><g><rect x="110" y="213" width="140" height="48" rx="8" fill="rgb(43, 43, 43)" stroke="rgb(161, 161, 170)"></rect><text x="180" y="242" text-anchor="middle" fill="rgb(255, 255, 255)" font-size="12"><tspan x="180" dy="0">Outer Transition?</tspan></text></g><g><rect x="110" y="303" width="140" height="48" rx="8" fill="rgb(43, 43, 43)" stroke="rgb(161, 161, 170)"></rect><text x="180" y="332" text-anchor="middle" fill="rgb(255, 255, 255)" font-size="12"><tspan x="180" dy="0">During Action</tspan></text></g><g><rect x="110" y="393" width="140" height="48" rx="8" fill="rgb(43, 43, 43)" stroke="rgb(161, 161, 170)"></rect><text x="180" y="422" text-anchor="middle" fill="rgb(255, 255, 255)" font-size="12"><tspan x="180" dy="0">Embedded X-Bridges</tspan></text></g><g><rect x="110" y="483" width="140" height="48" rx="8" fill="rgb(43, 43, 43)" stroke="rgb(161, 161, 170)"></rect><text x="180" y="512" text-anchor="middle" fill="rgb(255, 255, 255)" font-size="12"><tspan x="180" dy="0">Inner Transition?</tspan></text></g><g><rect x="110" y="573" width="140" height="48" rx="8" fill="rgb(43, 43, 43)" stroke="rgb(161, 161, 170)"></rect><text x="180" y="602" text-anchor="middle" fill="rgb(255, 255, 255)" font-size="12"><tspan x="180" dy="0">Child Layers</tspan></text></g><g><rect x="440" y="283" width="140" height="48" rx="8" fill="rgb(43, 43, 43)" stroke="rgb(161, 161, 170)"></rect><text x="510" y="312" text-anchor="middle" fill="rgb(255, 255, 255)" font-size="12"><tspan x="510" dy="0">Commit transition</tspan></text></g><g data-notation="flow" style="color: rgb(251, 146, 60);"><line x1="180" y1="95" x2="180" y2="115" stroke="rgb(251, 146, 60)" marker-end="url(#help-arrow-rj)"></line><text x="192" y="97" text-anchor="start" fill="rgb(251, 146, 60)" font-size="11">valid tick</text></g><g data-notation="flow" style="color: rgb(251, 146, 60);"><line x1="180" y1="185" x2="180" y2="205" stroke="rgb(251, 146, 60)" marker-end="url(#help-arrow-rj)"></line><text x="192" y="187" text-anchor="start" fill="rgb(251, 146, 60)" font-size="11"></text></g><g data-notation="flow" style="color: rgb(251, 146, 60);"><line x1="255" y1="255.9090909090909" x2="435" y2="294.09090909090907" stroke="rgb(251, 146, 60)" marker-end="url(#help-arrow-rj)"></line><text x="345" y="267" text-anchor="middle" fill="rgb(251, 146, 60)" font-size="11">selected route → return</text></g><g data-notation="flow" style="color: rgb(251, 146, 60);"><line x1="180" y1="275" x2="180" y2="295" stroke="rgb(251, 146, 60)" marker-end="url(#help-arrow-rj)"></line><text x="192" y="277" text-anchor="start" fill="rgb(251, 146, 60)" font-size="11">none</text></g><g data-notation="flow" style="color: rgb(251, 146, 60);"><line x1="180" y1="365" x2="180" y2="385" stroke="rgb(251, 146, 60)" marker-end="url(#help-arrow-rj)"></line><text x="192" y="367" text-anchor="start" fill="rgb(251, 146, 60)" font-size="11"></text></g><g data-notation="flow" style="color: rgb(251, 146, 60);"><line x1="180" y1="455" x2="180" y2="475" stroke="rgb(251, 146, 60)" marker-end="url(#help-arrow-rj)"></line><text x="192" y="457" text-anchor="start" fill="rgb(251, 146, 60)" font-size="11"></text></g><g data-notation="flow" style="color: rgb(251, 146, 60);"><line x1="237.75" y1="475" x2="452.25" y2="345" stroke="rgb(251, 146, 60)" marker-end="url(#help-arrow-rj)"></line><text x="345" y="402" text-anchor="middle" fill="rgb(251, 146, 60)" font-size="11">selected route → return</text></g><g data-notation="flow" style="color: rgb(251, 146, 60);"><line x1="180" y1="545" x2="180" y2="565" stroke="rgb(251, 146, 60)" marker-end="url(#help-arrow-rj)"></line><text x="192" y="547" text-anchor="start" fill="rgb(251, 146, 60)" font-size="11">none</text></g></svg>