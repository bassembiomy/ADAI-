</text></g><g data-notation="call" style="color: rgb(251, 146, 60);"><line x1="266.66666666666663" y1="269" x2="453.3333333333333" y2="269" stroke="rgb(251, 146, 60)" marker-end="url(#help-arrow-r7)"></line><text x="360" y="261" text-anchor="middle" fill="rgb(251, 146, 60)" font-size="11">4. validate()</text></g><g data-notation="reply" style="color: rgb(251, 146, 60);"><line x1="453.3333333333333" y1="327" x2="266.66666666666663" y2="327" stroke="rgb(251, 146, 60)" stroke-dasharray="6 4" marker-end="url(#help-arrow-r7-open)"></line><text x="360" y="319" text-anchor="middle" fill="rgb(251, 146, 60)" font-size="11">5. validationResult</text></g><g data-notation="call" style="color: rgb(251, 146, 60);"><line x1="266.66666666666663" y1="385" x2="453.3333333333333" y2="385" stroke="rgb(251, 146, 60)" marker-end="url(#help-arrow-r7)"></line><text x="360" y="377" text-anchor="middle" fill="rgb(251, 146, 60)" font-size="11">6. persist()</text></g><g data-notation="call" style="color: rgb(251, 146, 60);"><line x1="453.3333333333333" y1="443" x2="640" y2="443" stroke="rgb(251, 146, 60)" marker-end="url(#help-arrow-r7)"></line><text x="546.6666666666666" y="435" text-anchor="middle" fill="rgb(251, 146, 60)" font-size="11">7. save()</text></g><g data-notation="reply" style="color: rgb(251, 146, 60);"><line x1="640" y1="501" x2="453.3333333333333" y2="501" stroke="rgb(251, 146, 60)" stroke-dasharray="6 4" marker-end="url(#help-arrow-r7-open)"></line><text x="546.6666666666666" y="493" text-anchor="middle" fill="rgb(251, 146, 60)" font-size="11">8. saved</text></g><g data-notation="reply" style="color: rgb(251, 146, 60);"><line x1="453.3333333333333" y1="559" x2="266.66666666666663" y2="559" stroke="rgb(251, 146, 60)" stroke-dasharray="6 4" marker-end="url(#help-arrow-r7-open)"></line><text x="360" y="551" text-anchor="middle" fill="rgb(251, 146, 60)" font-size="11">9. persisted</text></g><g data-notation="async" style="color: rgb(251, 146, 60);"><line x1="266.66666666666663" y1="617" x2="80" y2="617" stroke="rgb(251, 146, 60)" marker-end="url(#help-arrow-r7-open)"></line><text x="173.33333333333331" y="609" text-anchor="middle" fill="rgb(251, 146, 60)" font-size="11">10. validationFailed notification</text></g><g data-notation="reply" style="color: rgb(251, 146, 60);"><line x1="266.66666666666663" y1="675" x2="80" y2="675" stroke="rgb(251, 146, 60)" stroke-dasharray="6 4" marker-end="url(#help-arrow-r7-open)"></line><text x="173.33333333333331" y="667" text-anchor="middle" fill="rgb(251, 146, 60)" font-size="11">11. result</text></g></svg>