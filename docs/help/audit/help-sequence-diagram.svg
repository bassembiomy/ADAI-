<svg viewBox="0 0 720 738" role="img" aria-label="Self call/reply, validation, guarded alternatives and one final result reply." style="background:#222;color:#e2e8f0;font-family:Arial,sans-serif;" xmlns="http://www.w3.org/2000/svg" width="720" height="738"><title>Self call/reply, validation, guarded alternatives and one final result reply.</title><defs><marker id="help-arrow-r7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="rgb(255, 255, 255)"></path></marker><marker id="help-arrow-r7-open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="rgb(255, 255, 255)"></path></marker></defs><defs><marker id="help-arrow-r7-generalization" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M 0 0 L 12 6 L 0 12 z" fill="rgb(36, 36, 36)" stroke="rgb(255, 255, 255)"></path></marker></defs><g fill="none" stroke="rgb(161, 161, 170)"><rect x="12" y="355" width="696" height="306"></rect><text x="20" y="370" fill="rgb(255, 255, 255)" stroke="none" font-size="12">alt</text><g><text x="60" y="363" fill="rgb(255, 255, 255)" stroke="none" font-size="11">[valid]</text></g><g><line x1="12" x2="708" y1="587" y2="587" stroke-dasharray="6 4"></line><text x="60" y="595" fill="rgb(255, 255, 255)" stroke="none" font-size="11">[invalid]</text></g></g><g><line x1="80" y1="64" x2="80" y2="728" stroke="rgb(255, 255, 255)" opacity="0.35" stroke-dasharray="5 5"></line><rect x="10" y="10" width="140" height="48" rx="8" fill="rgb(43, 43, 43)" stroke="rgb(161, 161, 170)"></rect><text x="80" y="39" text-anchor="middle" fill="rgb(255, 255, 255)" font-size="12"><tspan x="80" dy="0">User</tspan></text></g><g><line x1="266.66666666666663" y1="64" x2="266.66666666666663" y2="728" stroke="rgb(255, 255, 255)" opacity="0.35" stroke-dasharray="5 5"></line><rect x="196.66