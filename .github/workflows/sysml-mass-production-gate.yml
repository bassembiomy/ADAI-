name: SysML mass-production release gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mass-production-gate:
    # Must run on Windows: the release gate pins the Windows vendor compiler
    # toolchains/w64devkit/w64devkit/bin/gcc.exe (SHA-256 verified by
    # scripts/verify_sysml_release.ts step 1), and the OPM host-compilation
    # gates resolve the bundled compiler on win32.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Provision pinned w64devkit toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'w64devkit-1.23.0.zip'
          Invoke-WebRequest -Uri 'https://github.com/skeeto/w64devkit/releases/download/v1.23.0/w64devkit-1.23.0.zip' -OutFile $zip
          $expectedZipSha256 = '5c7dce6762be3e0dba648a9317790444c0e2f1ef3e677315c115727d7a549539'
          $actualZipSha256 = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualZipSha256 -ne $expectedZipSha256) {
            throw "Pinned w64devkit archive hash mismatch. Expected $expectedZipSha256, got $actualZipSha256"
          }
          $dest = Join-Path $PWD 'toolchains/w64devkit'
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          Expand-Archive -LiteralPath $zip -DestinationPath $dest -Force
          & (Join-Path $dest 'w64devkit/bin/gcc.exe') --version
      - name: Install Playwright chromium
        run: npx playwright install chromium
      - name: Workspace hygiene
        run: git diff --check
      - name: SysML full release qualification
        run: npm run test:sysml:full-release
      - name: SysML real-browser end-to-end
        run: npm run test:e2e:sysml
      - name: Production build
        run: npm run build
