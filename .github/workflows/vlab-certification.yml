name: V-Lab Certification

on:
  push:
    paths:
      - 'src/engine/vlab/**'
      - 'src/components/vlab/**'
      - 'src/utils/vlab*'
      - 'benchmarks/simscape/**'
      - 'scripts/vlab_review/**'
      - '.github/workflows/vlab-certification.yml'
  pull_request:
    paths:
      - 'src/engine/vlab/**'
      - 'src/components/vlab/**'
      - 'src/utils/vlab*'
      - 'benchmarks/simscape/**'
      - 'scripts/vlab_review/**'
      - '.github/workflows/vlab-certification.yml'
  workflow_dispatch:

jobs:
  vlab-certify:
    name: V-Lab tests, type check and inventory
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: V-Lab certification (vitest + tsc + inventory)
        run: npx tsx scripts/vlab_review/certify.ts

      - name: Upload certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vlab-certification-evidence
          path: |
            docs/vlab-review/
          if-no-files-found: ignore
